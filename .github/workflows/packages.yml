    runs-on: ubuntu-24.04

    env:
      # CDNA 2 and 3 (MI200, MI300) and RDNA 2 and 3 (RX 6000, RX 7000)
      HIP_ARCHITECTURES: "gfx90a;gfx942;gfx1030;gfx1100"

    steps:
      - name: Checkout openEMS-Project.git
        uses: actions/checkout@v4
        with:
          repository: thliebig/openEMS-Project
