          objs=$(/opt/rocm/llvm/bin/llvm-objdump --offloading "$lib" || true)
          echo "$objs"
          for a in gfx90a gfx942 gfx1030 gfx1100; do
            echo "$objs" | grep -q "$a" || { echo "no code object for $a"; exit 1; }
          done

      - name: Test the programs in a clean system
