          echo "deb [arch=amd64] https://repo.radeon.com/rocm/apt/latest noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1001\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              hipcc hip-dev rocm-device-libs rocm-llvm comgr hsa-rocr-dev rocm-core
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "OPT=$RUNNER_TEMP/opt" >> $GITHUB_ENV

      - name: Build and install fparser, CSXCAD and openEMS
        run: |
          configure() {  # configure <dir> <cmake options...>
            local dir=$1; shift
            cmake -S "$GITHUB_WORKSPACE/$dir" -B "$RUNNER_TEMP/build/$dir" -GNinja \
                  -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$OPT" "$@"
          }
          build_install() {
            cmake --build "$RUNNER_TEMP/build/$1" --parallel
            cmake --install "$RUNNER_TEMP/build/$1"
          }
          configure fparser && build_install fparser
          configure CSXCAD -DFPARSER_ROOT_DIR="$OPT" && build_install CSXCAD
          configure openEMS -DFPARSER_ROOT_DIR="$OPT" -DCSXCAD_ROOT_DIR="$OPT" \
              -DCMAKE_HIP_PLATFORM=amd -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
              -DCMAKE_HIP_ARCHITECTURES="$HIP_ARCHITECTURES"
          grep -q '^ENABLE_HIP:BOOL=ON' "$RUNNER_TEMP/build/openEMS/CMakeCache.txt" || {
            echo "the HIP backend is not enabled"; ls -l /opt/rocm/llvm/bin/clang++ /usr/local/cuda-12.8/bin/nvcc 2>&1; exit 1; }
          build_install openEMS

      - name: Set up Python 3.13 and 3.14
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13
            3.14
          allow-prereleases: true

      - name: Build the Python wheels
        run: |
          export CSXCAD_INSTALL_PATH="$OPT" OPENEMS_INSTALL_PATH="$OPT"
          mkdir -p "$RUNNER_TEMP/wheels"
          for v in 3.13 3.14; do
            python$v -m venv "$RUNNER_TEMP/venv$v"
            py="$RUNNER_TEMP/venv$v/bin/python"
            $py -m pip install --upgrade pip cython setuptools setuptools-scm wheel numpy
            # CSXCAD first, installed: openEMS needs its Cython declarations
            (cd "$GITHUB_WORKSPACE/CSXCAD/python" && rm -rf build &&
             $py -m pip wheel . --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels")
            $py -m pip install "$RUNNER_TEMP"/wheels/csxcad-*-cp${v/./}-*.whl
            (cd "$GITHUB_WORKSPACE/openEMS/python" && rm -rf build &&
             $py -m pip wheel . --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels")
          done
          ls -l "$RUNNER_TEMP/wheels"

      - name: Assemble the package
        id: pkg
        run: |
          gitdesc=$(git -C "$GITHUB_WORKSPACE/openEMS" describe --tags --always)
          stem="openEMS_linux_x86_64_${gitdesc}_rocm"
          pkg="$RUNNER_TEMP/pkgstage/openEMS"
          mkdir -p "$pkg/lib" "$pkg/python"
          cp -a "$OPT/bin" "$OPT/share" "$pkg/"
          cp -a "$OPT"/lib/*.so* "$pkg/lib/"
          # the libraries they need, relative run paths
          python3 "$GITHUB_WORKSPACE/openEMS/.github/packaging/bundle_linux.py" "$pkg"
          cp "$RUNNER_TEMP"/wheels/*.whl "$pkg/python/"
          cp -r "$GITHUB_WORKSPACE/openEMS/python/Tutorials" "$pkg/python/"
          sed "s/@PACKAGE_NAME@/$stem/" "$GITHUB_WORKSPACE/openEMS/.github/packaging/README-linux-amd.txt" > "$pkg/README.txt"
          tar -C "$RUNNER_TEMP/pkgstage" -czf "$RUNNER_TEMP/$stem.tar.gz" openEMS
          du -sh "$pkg" "$RUNNER_TEMP/$stem.tar.gz"
          echo "name=$stem" >> $GITHUB_OUTPUT

      - name: Check the GPU code in the package
        run: |
          # a code object for every architecture, in the bundled ELF
