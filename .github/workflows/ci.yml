name: "CI"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - "**"

jobs:
  Lint:
    runs-on: ubuntu-latest
    name: "Lint"

    steps:
      - name: Checkout openEMS.git
        uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          if grep -rPn "[ \t]\r?$" --include="*.cpp" --include="*.h" .; then
            echo "Error: trailing whitespace found (see above)"
            exit 1
          fi


  Dependencies:
    runs-on: ubuntu-latest
    name: "Resolve repo dependencies"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve repo dependencies
        id: resolve-dependencies
        # writes to $GITHUB_OUTPUT file
        run: |
          python3 $GITHUB_WORKSPACE/.github/scripts/resolve_dependent_repos.py \
                  --project openEMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}

      # format a human-friendly string in the following format:
      #
      # * Checkout XXXX.git
      # (keep the "master" branch case boring to avoid information overload)
      #
      # OR:
      #
      # * Checkout XXXX.git | PR: https://example.com/XXXX
      #
      # OR:
      #
      # * Checkout XXXX.git | branch: feature | http://example.com/XXXX
      - name: Format title strings
        id: format-title
        shell: python
        run: |
          import os

          def format_title_string(var, repo, pr_url, branch):
            title = "Checkout %s.git" % repo
            if pr_url != "None":
              title += " | PR: %s" % pr_url
            elif branch != "master":
              title += " | branch: %s | %s/%s/tree/%s" % (
                branch, ${{ toJSON(github.server_url) }}, repo, branch
              )
            with open(os.getenv("GITHUB_OUTPUT"), "a") as output:
              output.write("%s=%s\n" % (var, title))

          format_title_string(
            "fparser_checkout_title",
            # escape special characters (single and double quotes) in string
            # using JSON representation
            ${{ toJSON(steps.resolve-dependencies.outputs.fparser_repo) }},
            ${{ toJSON(steps.resolve-dependencies.outputs.fparser_pr_url) }},
            ${{ toJSON(steps.resolve-dependencies.outputs.fparser_branch) }}
          )
          format_title_string(
            "CSXCAD_checkout_title",
            ${{ toJSON(steps.resolve-dependencies.outputs.csxcad_repo) }},
            ${{ toJSON(steps.resolve-dependencies.outputs.csxcad_pr_url) }},
            ${{ toJSON(steps.resolve-dependencies.outputs.csxcad_branch) }}
          )

    # map a step output to a job output
    outputs:
      fparser_repo: ${{ steps.resolve-dependencies.outputs.fparser_repo }}
      fparser_branch: ${{ steps.resolve-dependencies.outputs.fparser_branch }}
      fparser_checkout_title: ${{ steps.format-title.outputs.fparser_checkout_title }}

      csxcad_repo: ${{ steps.resolve-dependencies.outputs.CSXCAD_repo }}
      csxcad_branch: ${{ steps.resolve-dependencies.outputs.CSXCAD_branch }}
      csxcad_checkout_title: ${{ steps.format-title.outputs.CSXCAD_checkout_title }}

  Linux:
    runs-on: ubuntu-latest
    needs: Dependencies

    defaults:
      run:
        shell: bash

    strategy:
      # Use "false" means a single failed build won't terminate other combinations
      # in the matrix. This wastes CPU time, but is an important debugging tool to
      # prevent a single broken platform from stopping the whole matrix.
      fail-fast: false

      matrix:
        os:
          # name: OS name (only a name for humans to read).
          # libc: userland libc, "GNU" or "musl"
          #       (only a name for humans to read)
          # docker-image: string, image on DockerHub to use
          # full-tests: true or false (default false).
          #             true: also run the full Octave and Python test suites,
          #                   which simulate. They check numerical results,
          #                   which are a property of the source and not of the
          #                   distribution, so exactly one modern entry should
          #                   carry them; the smoketests above are what covers
          #                   every entry.
          - name: "Debian oldstable"
            libc: "GNU"
            docker-image: "debian:oldstable"

          - name: "Debian"
            libc: "GNU"
            docker-image: "debian:latest"

          - name: "Ubuntu"
            libc: "GNU"
            docker-image: "ubuntu:latest"
            full-tests: true

          # gpu: also build a HIP GPU plugin and check it on a runner without a GPU;
          # rocm: for AMD, with ROCm from AMD's Python wheels; cuda: for NVIDIA, the
          # HIP sources compiled as CUDA, with the HIP headers from those wheels
          - name: "Ubuntu + ROCm"
            libc: "GNU"
            docker-image: "ubuntu:latest"
            gpu: "rocm"

          - name: "Ubuntu + CUDA"
            libc: "GNU"
            docker-image: "nvidia/cuda:12.9.1-devel-ubuntu24.04"
            gpu: "cuda"

          # gpu: "sycl": the SYCL plugin for Intel GPUs, built by icpx from Intel's
          # oneAPI apt repository, and run on the OpenCL CPU device that comes with it
          - name: "Ubuntu + oneAPI"
            libc: "GNU"
            docker-image: "ubuntu:latest"
            gpu: "sycl"

          - name: "Fedora"
            libc: "GNU"
            docker-image: "fedora:latest"

          - name: "AlmaLinux 8"
            libc: "GNU"
            docker-image: "almalinux:8"

          - name: "AlmaLinux 9"
            libc: "GNU"
            docker-image: "almalinux:9"

          # Waiting for upstream packages:
          # https://bugzilla.redhat.com/show_bug.cgi?id=2374130
          # https://bugzilla.redhat.com/show_bug.cgi?id=2419727
          #
          #- name: "AlmaLinux Latest"
          #  libc: "GNU"
          #  docker-image: "almalinux:latest"

          - name: "Alpine"
            libc: "musl"
            docker-image: "alpine:latest"

    container:
      image: ${{ matrix.os.docker-image }}
      # allow mount/netns
      options: "--cap-add CAP_SYS_ADMIN --cap-add NET_ADMIN --security-opt apparmor=unconfined"

    name: "${{ matrix.os.libc }}/Linux (${{ matrix.os.name }})"

    env:
      # Wno-error is needed because any third-party dependencies
      # like compiler version changes or even Python libraries
      # installed by pip can block the pipeline, this is not what
      # we want.
      CXXFLAGS: "-Wall -Wextra -Wno-error"

    steps:
      - name: Check for dockerenv file
        # bash is not installed on Alpine at this point
        shell: sh
        run: (ls /.dockerenv && echo Found dockerenv) || exit 1

      - name: Show checkout sources
        shell: sh
        run: |
          echo "$FPARSER_CHECKOUT_TITLE"
          echo "$CSXCAD_CHECKOUT_TITLE"
        env:
          # convert template variables to shell variables to avoid arbitrary code injection
          FPARSER_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
          CSXCAD_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}

      # When checking out repos, I recommend running actions/checkout
      # as soon as possible before anything else, and in the reverse
      # order, from the project repo to its dependencies. This reduces
      # race conditions due to force pushes (they are harmless but
      # annoying).
      - name: Checkout openEMS.git
        uses: actions/checkout@v4
        with:
          path: openEMS
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.csxcad_repo }}"
          ref: "${{ needs.Dependencies.outputs.csxcad_branch }}"
          path: CSXCAD
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.fparser_repo }}"
          ref: "${{ needs.Dependencies.outputs.fparser_branch }}"
          path: fparser

      - name: Install dependencies
        shell: sh
        run: |
          cat /etc/os-release

          if grep -q "ID=fedora" /etc/os-release; then
            dnf install -y git
            dnf install -y gcc gcc-c++ cmake git boost-devel tinyxml-devel hdf5-devel zlib-devel \
                           octave octave-devel python3-pip python3-devel \
                           python3-setuptools python3-setuptools_scm \
                           python3-Cython python3-numpy python3-h5py python3-matplotlib

            # redhat-rpm-config provides /usr/lib/rpm/redhat/redhat-hardened-ld,
            # which GCC on Fedora requires for compilation, but is absent from the
            # minimal container image.
            dnf install -y redhat-rpm-config

            # only for CI/CD test builds without networks.
            dnf install -y iproute
          elif grep -q 'ID="almalinux"' /etc/os-release; then
            dnf install -y epel-release
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb

            dnf install -y git
            dnf install -y gcc gcc-c++ cmake git boost-devel tinyxml-devel hdf5-devel zlib-devel \
                           octave octave-devel python3-pip python3-devel \
                           python3-setuptools python3-wheel python3-setuptools_scm \
                           python3-Cython python3-numpy python3-h5py python3-matplotlib
            # for mkoctfile, see Fedora above
            dnf install -y redhat-rpm-config

            # only for CI/CD test builds without networks.
            dnf install -y iproute
          elif grep -q "ID=debian" /etc/os-release || grep -q "ID=ubuntu" /etc/os-release; then
            # retry failed downloads 3 times
            echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/80-retries
            apt-get update

            apt-get install -y build-essential git \
                               libhdf5-dev libtinyxml-dev zlib1g-dev \
                               octave \
                               python3-pip \
                               python3-setuptools python3-numpy python3-matplotlib python3-h5py

            # only for CI/CD test builds without networks.
            apt-get install -y iproute2

            apt-get install -y libboost-all-dev
            apt-get install -y cmake
            # octave-dev (Bookworm+/Ubuntu 22.04+) was renamed from liboctave-dev (Bullseye and older)
            apt-get install -y octave-dev || apt-get install -y liboctave-dev
            apt-get install -y python3-setuptools-scm cython3 python3-matplotlib

            # testing Python packages in isolated venv
            apt-get install -y python3-venv
          elif grep -q "ID=alpine" /etc/os-release; then
            apk add bash \
                    build-base git cmake \
                    boost-dev tinyxml-dev hdf5-dev zlib-dev \
                    octave octave-dev \
                    python3-dev py3-pip \
                    py3-setuptools py3-setuptools_scm cython \
                    py3-numpy py3-h5py py3-matplotlib

            # only for CI/CD test builds without networks.
            apk add iproute2
          else
            echo "Unknown system!"
            exit 1
          fi

      - name: Install ROCm (AMD's Python wheels)
        if: matrix.os.gpu == 'rocm'
        run: |
          python3 -m venv /opt/rocm-venv
          /opt/rocm-venv/bin/pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[devel]==10.0.0"
          /opt/rocm-venv/bin/rocm-sdk init
          ROCM_ROOT=$(/opt/rocm-venv/bin/rocm-sdk path --root)
          echo "ROCm: $ROCM_ROOT"
          ls $ROCM_ROOT/lib/libamdhip64* $ROCM_ROOT/lib/llvm/bin/clang++
          echo "ROCM_PATH=$ROCM_ROOT" >> $GITHUB_ENV
          # clang does not report this layout as a HIP installation by itself
          echo "HIP_PATH=$ROCM_ROOT" >> $GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$ROCM_ROOT/lib/llvm/amdgcn/bitcode" >> $GITHUB_ENV
          echo "OPENEMS_CI_GPU=rocm" >> $GITHUB_ENV

      - name: Install the HIP headers for NVIDIA (AMD's apt repository)
        if: matrix.os.gpu == 'cuda'
        run: |
          # only the headers of one ROCm version, unpacked without dependencies:
          # hip-runtime-nvidia would pull in NVIDIA's cuda meta package with the driver
          apt-get install -y curl gnupg
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor > /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.4 noble main" \
            > /etc/apt/sources.list.d/rocm.list
          apt-get update
          mkdir -p /tmp/hipdeb && cd /tmp/hipdeb
          apt-get download hip-dev hip-runtime-nvidia
          for deb in *.deb; do dpkg -x $deb /opt/hip; done
          ROCM_ROOT=$(ls -d /opt/hip/opt/rocm-*)
          ls $ROCM_ROOT/include/hip/hip_runtime.h $ROCM_ROOT/include/hip/hip_version.h $ROCM_ROOT/include/hip/nvidia_detail/nvidia_hip_runtime.h
          echo "ROCM_PATH=$ROCM_ROOT" >> $GITHUB_ENV
          echo "OPENEMS_CI_GPU=cuda" >> $GITHUB_ENV

      - name: Install the Intel oneAPI DPC++ compiler (Intel's apt repository)
        if: matrix.os.gpu == 'sycl'
        run: |
          # icpx with the SYCL runtime and the OpenCL CPU device, no GPU driver
          apt-get install -y curl gnupg
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor > /usr/share/keyrings/oneapi.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
            > /etc/apt/sources.list.d/oneapi.list
          apt-get update
          apt-get install -y --no-install-recommends intel-oneapi-dpcpp-cpp-2026.2
          ONEAPI_ROOT=/opt/intel/oneapi
          $ONEAPI_ROOT/compiler/latest/bin/icpx --version
          echo "ONEAPI_ROOT=$ONEAPI_ROOT" >> $GITHUB_ENV
          echo "OPENEMS_CI_GPU=sycl" >> $GITHUB_ENV

      - name: Build and install fparser
        run: |
          cd $GITHUB_WORKSPACE/fparser
          mkdir build && cd build
          cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt
          make -j`nproc` && make install

      - name: Build and install CSXCAD
        run: |
          # cmake may fail with "fatal: No names found, cannot describe anything."
          # if it happens, check if you're using a shallow clone, or if it's a GitHub
          # fork created with "Copy the master branch only". If so, you need to FULL
          # fork or clone.
          #
          # MPI may also fail, but this error is not fatal. The real error is often
          # the error above! There's no need to install MPI.
          cd $GITHUB_WORKSPACE/CSXCAD
          mkdir build && cd build
          cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt
          make -j`nproc` && make install

      - name: Build and install CSXCAD Python module with --no-build-isolation
        run: |
          cd $GITHUB_WORKSPACE/CSXCAD/python
          export CSXCAD_INSTALL_PATH=$HOME/opt/

          pip_opts=( "--user" "--verbose" )
          # some systems don't have --no-build-isolation, some systems don't have
          # --break-system-packages, the oldest systems don't have both.
          if pip3 install --help | grep -q no-build-isolation; then
            pip_opts+=( "--no-build-isolation" )
          fi
          if pip3 install --help | grep -q break-system-packages; then
            pip_opts+=( "--break-system-packages" )
          fi
          # run in an isolated container without network, ensure
          # pip install really works without auto-downloads.
          ip netns add no-network
          ip netns exec no-network pip3 install . "${pip_opts[@]}"

      - name: Build and install openEMS
        run: |
          cd $GITHUB_WORKSPACE/openEMS
          mkdir build && cd build
          gpu_opts=()
          if [ "${OPENEMS_CI_GPU:-}" = "cuda" ]; then
            gpu_opts=( -DENABLE_HIP=ON -DOPENEMS_HIP_AS_CUDA=ON )
          elif [ "${OPENEMS_CI_GPU:-}" = "rocm" ]; then
            # ROCm's clang takes the newest GCC directory it finds, which need not be
            # the one with C++ headers: use the GCC of the system's g++
            gpu_opts=( -DENABLE_HIP=ON -DCMAKE_HIP_COMPILER=$ROCM_PATH/lib/llvm/bin/clang++
                       -DCMAKE_HIP_COMPILER_ROCM_ROOT=$ROCM_PATH
                       "-DCMAKE_HIP_FLAGS=--gcc-install-dir=$(dirname $(g++ -print-libgcc-file-name))" )
          elif [ "${OPENEMS_CI_GPU:-}" = "sycl" ]; then
            # icpx builds the plugin in a sub-build against the GCC of g++; without
            # ocloc no ahead-of-time GPU code: SPIR-V only, compiled at run time
            gpu_opts=( -DENABLE_SYCL=ON -DOPENEMS_ICPX=$ONEAPI_ROOT/compiler/latest/bin/icpx
                       -DOPENEMS_SYCL_AOT_DEVICES= )
          fi
          cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt -DFPARSER_ROOT_DIR=$HOME/opt "${gpu_opts[@]}"
          make -j`nproc` && make install

          echo "addpath('~/opt/share/openEMS/matlab')" >> ~/.octaverc
          echo "addpath('~/opt/share/CSXCAD/matlab')" >> ~/.octaverc

      - name: Run Octave setup (compile h5readatt_octave)
        run: octave --no-gui --eval "setup()"

      - name: Build and install openEMS Python module with --no-build-isolation
        run: |
          cd $GITHUB_WORKSPACE/openEMS/python

          # Python "exit(False)" = bash "if true"
          # Python "exit(True)" = bash "if false"
          if python3 -c "import pip; exit(int(pip.__version__.split('.')[0]) > 20)"; then
            # old pip < 21.3 (checking <= 21 here for simplicity),
            # CSXCAD needs CSXCAD_PYSRC_PATH as auto-detection is
            # not reliable.
            export CSXCAD_PYSRC_PATH=$GITHUB_WORKSPACE/CSXCAD/python/
          fi

          pip_opts=( "--user" "--verbose" )
          # some systems don't have --no-build-isolation, some systems don't have
          # --break-system-packages, the oldest systems don't have both.
          if pip3 install --help | grep -q no-build-isolation; then
            pip_opts+=( "--no-build-isolation" )
          fi
          if pip3 install --help | grep -q break-system-packages; then
            pip_opts+=( "--break-system-packages" )
          fi

          export CSXCAD_INSTALL_PATH=$HOME/opt/
          export OPENEMS_INSTALL_PATH=$HOME/opt/
          # run in an isolated container without network, ensure
          # pip install really works without auto-downloads.
          ip netns exec no-network pip3 install . "${pip_opts[@]}"

      - name: Smoketest Octave execution
        run: |
          cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/octave
          octave MSL_NotchFilter.m

      - name: Smoketest Python execution
        run: |
          cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/python
          python3 -c "import CSXCAD; print(CSXCAD.__version__)"
          python3 -c "import openEMS; print(openEMS.__version__)"
          python3 MSL_NotchFilter.py

      - name: Run Python unit tests
        run: |
          python3 -m unittest discover -s $GITHUB_WORKSPACE/openEMS/python/Tests -p "test_*.py" -v

      - name: GPU plugin on a machine without a GPU
        if: matrix.os.gpu
        run: |
          case "$OPENEMS_CI_GPU" in
            cuda) name=hip-nvidia ;;
            sycl) name=sycl ;;
            *)    name=hip-amd ;;
          esac
          plugin=$HOME/opt/lib/openEMS/plugins/openEMS_gpu_${name/-/_}.so
          ls -l $plugin
          readelf -d $plugin | grep NEEDED
          # libopenEMS itself needs no GPU runtime
          if readelf -d $HOME/opt/lib/libopenEMS.so | grep -qE "amdhip64|cudart|libcuda|libsycl"; then
            echo "libopenEMS links a GPU runtime"; exit 1
          fi
          cd /tmp
          cat > gpu_run.py << 'EOF'
          import tempfile
          from CSXCAD import ContinuousStructure
          from openEMS.openEMS import openEMS
          fdtd = openEMS(NrTS=10, EndCriteria=0)
          fdtd.SetGaussExcite(1e9, 1e9)
          fdtd.SetBoundaryCond(['PEC'] * 6)
          csx = ContinuousStructure()
          fdtd.SetCSX(csx)
          grid = csx.GetGrid()
          grid.SetDeltaUnit(1e-3)
          for d in 'xyz':
              grid.SetLines(d, range(10))
          csx.AddExcitation('ex', 0, [0, 0, 1]).AddBox([4, 4, 4], [4, 4, 6])
          fdtd.Run(tempfile.mkdtemp(), verbose=1, engine='gpu')
          EOF
          # the plugin loads (the AMD and the SYCL one find the runtime they were
          # built with through their RPATH, the NVIDIA one has the CUDA runtime
          # linked in), finds no device, and the GPU engine fails cleanly
          python3 gpu_run.py > out.txt 2>&1 || true
          cat out.txt
          grep -q "no $name device" out.txt
          grep -q "no GPU backend with a usable device" out.txt

      - name: SYCL backend on the OpenCL CPU device
        if: matrix.os.gpu == 'sycl'
        run: |
          # the GPU engine test with the SYCL kernels run on the CPU, compared with
          # the basic engine; the oneAPI environment has the libraries of the OpenCL
          # CPU runtime (TBB)
          source $ONEAPI_ROOT/setvars.sh
          cd $GITHUB_WORKSPACE/openEMS/python/Tests
          OPENEMS_SYCL_CPU=1 python3 GPU_Engine.py | tee /tmp/gpu_engine.txt
          # the test passes without a device too: make sure the SYCL backend ran
          grep -q "SYCL backend: max. deviation" /tmp/gpu_engine.txt
          if grep -q "device backend not tested" /tmp/gpu_engine.txt; then exit 1; fi

      - name: Run Octave test suite
        if: matrix.os.full-tests
        run: |
          cd $GITHUB_WORKSPACE/openEMS/TESTSUITE
          octave --no-gui run_testsuite.m

      - name: Run Python simulation test suite
        if: matrix.os.full-tests
        run: |
          cd $GITHUB_WORKSPACE/openEMS/python/Tests
          python3 run_testsuite.py

      - name: Benchmark smoke run
        if: matrix.os.full-tests
        run: |
          # keeps the benchmark working, the timing of a shared runner means nothing
          cd /tmp
          python3 $GITHUB_WORKSPACE/openEMS/benchmark/bench.py run --openems $HOME/opt/bin/openEMS \
                  --size XS --repeat 1 --duration 0.5 --threads 2 --workdir bench
          python3 $GITHUB_WORKSPACE/openEMS/benchmark/bench.py compare bench/result.json bench/result.json

      - name: Create Python venv and install dependencies
        run: |
          cd ~/

          python3 -m venv ~/venv
          source ~/venv/bin/activate

          pip install --upgrade pip

      - name: Build and install CSXCAD Python module in venv
        run: |
          source ~/venv/bin/activate
          cd $GITHUB_WORKSPACE/CSXCAD/python
          export CSXCAD_INSTALL_PATH="$HOME/opt"
          pip3 install . --verbose

      - name: Build and install openEMS Python module in venv
        run: |
          source ~/venv/bin/activate
          cd $GITHUB_WORKSPACE/openEMS/python

          # Build against the CSXCAD checkout resolved by the Dependencies
          # job. Auto-detection does not find it next to us and falls back to
          # downloading CSXCAD from its master branch, which ignores the
          # branch under test.
          export CSXCAD_PYSRC_PATH=$GITHUB_WORKSPACE/CSXCAD/python/

          export CSXCAD_INSTALL_PATH="$HOME/opt"
          export OPENEMS_INSTALL_PATH="$HOME/opt"
          pip3 install . --verbose

      - name: Smoketest Python execution in venv
        run: |
          source ~/venv/bin/activate
          cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/python
          python3 -c "import CSXCAD; print(CSXCAD.__version__)"
          python3 -c "import openEMS; print(openEMS.__version__)"
          python3 MSL_NotchFilter.py

      - name: Run Python unit tests in venv
        run: |
          source ~/venv/bin/activate
          python3 -m unittest discover -s $GITHUB_WORKSPACE/openEMS/python/Tests -p "test_*.py" -v

  macOS:
    name: "macOS (ARM, latest)"

    runs-on: macos-latest
    needs: Dependencies

    steps:
      - name: Show checkout sources
        run: |
          echo "$FPARSER_CHECKOUT_TITLE"
          echo "$CSXCAD_CHECKOUT_TITLE"
        env:
          # convert template variables to shell variables to avoid arbitrary code injection
          FPARSER_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
          CSXCAD_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}

      # When checking out repos, I recommend running actions/checkout
      # as soon as possible before anything else, and in the reverse
      # order, from the project repo to its dependencies. This reduces
      # race conditions due to force pushes (they are harmless but
      # annoying).
      - name: Checkout openEMS.git
        uses: actions/checkout@v4
        with:
          path: openEMS
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.csxcad_repo }}"
          ref: "${{ needs.Dependencies.outputs.csxcad_branch }}"
          path: CSXCAD
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.fparser_repo }}"
          ref: "${{ needs.Dependencies.outputs.fparser_branch }}"
          path: fparser

      - name: Install dependencies
        run: |
          touch ~/.zprofile  # set environment variables here
          echo 'export CXXFLAGS="-Wall -Wextra -Wno-error"' >> ~/.zprofile

          # already installed on the CI/CD system, disable to avoid warning fatigue
          # brew install python3 cmake
          brew install boost hdf5 octave python@3.14

          # Homebrew's default Python is 3.15, for which h5py has no wheels yet
          # (pip would build it from source and fail): use 3.14 in every
          # following step, with the Python packages installed by its pip.
          PYBIN="$(brew --prefix python@3.14)/libexec/bin"
          echo "$PYBIN" >> $GITHUB_PATH
          "$PYBIN/pip3" install --break-system-packages \
                        setuptools setuptools_scm cython numpy matplotlib h5py

          echo "export NCPUS=$(python3 -c 'import os; print(os.cpu_count())')" >> ~/.zprofile
          source ~/.zprofile

          # TinyXML has been disabled by Homebrew at it's unmaintained
          # since 2011, TinyXML2 is not API-compatible. As a stop-gap,
          # build from source.
          #
          # -L: follow redirect, REQUIRED!
          curl -L https://sourceforge.net/projects/tinyxml/files/tinyxml/2.6.2/tinyxml_2_6_2.tar.gz -o tinyxml-2.6.2.tar.gz
          tar -xf tinyxml-2.6.2.tar.gz
          cd tinyxml

          # The first patch enforces use of stl strings, rather than a custom string type.
          # The second patch is a fix for incorrect encoding of elements with special characters
          # The third and fourth patches are security fixes.
          #
          # -L: follow redirect, REQUIRED!
          # -O: save to disk with an automatic file name.
          curl -L -O "https://raw.githubusercontent.com/alpinelinux/aports/b1ff376e83eb49c0127b039b3684eccdf9a60694/community/tinyxml/tinyxml-2.6.2-defineSTL.patch"
          curl -L -O "https://raw.githubusercontent.com/alpinelinux/aports/b1ff376e83eb49c0127b039b3684eccdf9a60694/community/tinyxml/tinyxml-2.6.1-entity.patch"
          curl -L -O "https://raw.githubusercontent.com/alpinelinux/aports/b1ff376e83eb49c0127b039b3684eccdf9a60694/community/tinyxml/CVE-2021-42260.patch"
          curl -L -O "https://raw.githubusercontent.com/alpinelinux/aports/b1ff376e83eb49c0127b039b3684eccdf9a60694/community/tinyxml/CVE-2023-34194.patch"

          # The final patch adds a CMakeLists.txt file to build a shared library and provide an install target
          # submitted upstream as https://sourceforge.net/p/tinyxml/patches/66/
          curl -L -O "https://gist.githubusercontent.com/scpeters/6325123/raw/cfb079be67997cb19a1aee60449714a1dedefed5/tinyxml_CMakeLists.patch"

          patch -p1 < tinyxml-2.6.2-defineSTL.patch
          patch -p1 < tinyxml-2.6.1-entity.patch
          patch -p1 < CVE-2021-42260.patch
          patch -p1 < CVE-2023-34194.patch

          # You know something is truly deprecated when the patch itself needs
          # patching! In CMake 4, 3.10 is deprecated and 3.5 has been removed.
          # use 3.0...3.10 so all of these versions are acceptable as min. version.
          # (CMake 2 is dropped since openEMS already requires CMake 3, and also
          # because CMake 2 is too old that it's not even documented anymore)
          #
          # https://cmake.org/cmake/help/latest/command/cmake_minimum_required.html
          sed -i -e "s/cmake_minimum_required(VERSION 2.4.6)/cmake_minimum_required(VERSION 3.0...3.10)/" \
                    tinyxml_CMakeLists.patch  # -e is not optional in BSD sed
          patch -p1 < tinyxml_CMakeLists.patch

          mkdir build && cd build
          cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt
          make -j$NCPUS && make install

      - name: Build and install fparser
        run: |
          source ~/.zprofile
          cd $GITHUB_WORKSPACE/fparser
          mkdir build && cd build
          cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt
          make -j$NCPUS && make install

      - name: Build and install CSXCAD
        run: |
          # cmake may fail with "fatal: No names found, cannot describe anything."
          # if it happens, check if you're using a shallow clone, or if it's a GitHub
          # fork created with "Copy the master branch only". If so, you need to FULL
          # fork or clone.
          #
          # MPI may also fail, but this error is not fatal. The real error is often
          # the error above! There's no need to install MPI.
          source ~/.zprofile
          cd $GITHUB_WORKSPACE/CSXCAD
          mkdir build && cd build
          cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt
          make -j$NCPUS && make install

      - name: Build and install CSXCAD Python module with --no-build-isolation
        run: |
          source ~/.zprofile
          cd $GITHUB_WORKSPACE/CSXCAD/python
          export CSXCAD_INSTALL_PATH=$HOME/opt/
          pip3 install . --user --break-system-packages --no-build-isolation --verbose

      - name: Build and install openEMS
        run: |
          source ~/.zprofile
          cd $GITHUB_WORKSPACE/openEMS
          mkdir build && cd build
          cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt -DFPARSER_ROOT_DIR=$HOME/opt
          make -j$NCPUS && make install

          echo "addpath('~/opt/share/openEMS/matlab')" >> ~/.octaverc
          echo "addpath('~/opt/share/CSXCAD/matlab')" >> ~/.octaverc

      - name: Run Octave setup (compile h5readatt_octave)
        run: octave --no-gui --eval "setup()"

      - name: Build and install openEMS Python module with --no-build-isolation
        run: |
          source ~/.zprofile
          cd $GITHUB_WORKSPACE/openEMS/python
          export CSXCAD_INSTALL_PATH=$HOME/opt/
          export OPENEMS_INSTALL_PATH=$HOME/opt/
          pip3 install . --user --break-system-packages --no-build-isolation --verbose

      - name: Smoketest Octave execution
        run: |
          cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/octave
          octave MSL_NotchFilter.m

      - name: Smoketest Python execution
        run: |
          cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/python
          python3 -c "import CSXCAD; print(CSXCAD.__version__)"
          python3 -c "import openEMS; print(openEMS.__version__)"
          python3 MSL_NotchFilter.py

      - name: Run Python unit tests
        run: |
          python3 -m unittest discover -s $GITHUB_WORKSPACE/openEMS/python/Tests -p "test_*.py" -v

      - name: Create Python venv and install dependencies
        run: |
          # remove Python dependencies to see if venv really works
          pip3 uninstall -y CSXCAD openEMS --break-system-packages
          pip3 uninstall -y cython numpy matplotlib h5py --break-system-packages

          python3 -m venv ~/venv
          source ~/venv/bin/activate
          pip3 install --upgrade pip

      - name: Build and install CSXCAD Python module in venv
        run: |
          source ~/venv/bin/activate
          cd $GITHUB_WORKSPACE/CSXCAD/python
          export CSXCAD_INSTALL_PATH="$HOME/opt"
          pip3 install . --verbose

      - name: Build and install openEMS Python module in venv
        run: |
          source ~/venv/bin/activate
          cd $GITHUB_WORKSPACE/openEMS/python

          # \sa the GNU/Linux job, same reason
          export CSXCAD_PYSRC_PATH=$GITHUB_WORKSPACE/CSXCAD/python/

          export CSXCAD_INSTALL_PATH="$HOME/opt"
          export OPENEMS_INSTALL_PATH="$HOME/opt"
          pip3 install . --verbose

      - name: Smoketest Python execution in venv
        run: |
          source ~/venv/bin/activate
          cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/python
          python3 -c "import CSXCAD; print(CSXCAD.__version__)"
          python3 -c "import openEMS; print(openEMS.__version__)"
          python3 MSL_NotchFilter.py

      - name: Run Python unit tests in venv
        run: |
          source ~/venv/bin/activate
          python3 -m unittest discover -s $GITHUB_WORKSPACE/openEMS/python/Tests -p "test_*.py" -v

  FreeBSD:
    runs-on: ubuntu-latest
    needs: Dependencies

    strategy:
      matrix:
        machine:
          - name: "FreeBSD 14.2"
            os: freebsd
            arch: x86-64
            version: '14.2'

          # macOS already tests ARM for us, so disable the slow ARM emulator
          # for now
          #- name: "FreeBSD 14.2 (ARM emulator)"
          #  os: freebsd
          #  arch: arm64
          #  version: '14.2'

    name: "${{ matrix.machine.name }}"

    steps:
      - name: Show checkout sources
        run: |
          echo "$FPARSER_CHECKOUT_TITLE"
          echo "$CSXCAD_CHECKOUT_TITLE"
        env:
          # convert template variables to shell variables to avoid arbitrary code injection
          FPARSER_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
          CSXCAD_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}

      # When checking out repos, I recommend running actions/checkout
      # as soon as possible before anything else, and in the reverse
      # order, from the project repo to its dependencies. This reduces
      # race conditions due to force pushes (they are harmless but
      # annoying).
      - name: Checkout openEMS.git
        uses: actions/checkout@v4
        with:
          path: openEMS
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.csxcad_repo }}"
          ref: "${{ needs.Dependencies.outputs.csxcad_branch }}"
          path: CSXCAD
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.fparser_repo }}"
          ref: "${{ needs.Dependencies.outputs.fparser_branch }}"
          path: fparser

      - name: Test in FreeBSD ${{ matrix.machine.version }} ${{ matrix.machine.arch }}
        uses: cross-platform-actions/action@v0.26.0
        with:
          cpu_count: 4
          architecture: ${{ matrix.machine.arch }}
          operating_system: ${{ matrix.machine.os }}
          version: ${{ matrix.machine.version }}
          run: |
            echo "Install dependencies..."
            # patchelf: meson-python >= 0.22 runs it while building a wheel, and
            # PyPI ships no FreeBSD wheels, so the venv stage below builds numpy
            # from source.
            sudo pkg install -y cmake git boost-libs tinyxml hdf5 octave pkgconf \
                                python3 patchelf
            # Derive the version prefix from whatever Python FreeBSD ships
            # (e.g. "py311" for 3.11, "py313" for 3.13) so the CI doesn't
            # break when FreeBSD bumps its default Python version.
            PYVER=$(python3 -c "import sys; print('py{}{}'.format(*sys.version_info[:2]))")
            sudo pkg install -y ${PYVER}-pip \
                                ${PYVER}-setuptools ${PYVER}-wheel ${PYVER}-setuptools-scm \
                                ${PYVER}-numpy ${PYVER}-h5py ${PYVER}-matplotlib
            # cython3 package name varies across FreeBSD quarterly snapshots; use pip
            pip install --user --break-system-packages cython

            export CXXFLAGS="-Wall -Wextra -Wno-error"
            export NCPUS=$(python3 -c 'import os; print(os.cpu_count())')

            echo "Build and install fparser..."
            cd $GITHUB_WORKSPACE/fparser
            mkdir build && cd build
            cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt
            make -j$NCPUS && make install

            echo "Build and install CSXCAD..."
            # cmake may fail with "fatal: No names found, cannot describe anything."
            # if it happens, check if you're using a shallow clone, or if it's a GitHub
            # fork created with "Copy the master branch only". If so, you need to FULL
            # fork or clone.
            #
            # MPI may also fail, but this error is not fatal. The real error is often
            # the error above! There's no need to install MPI.
            cd $GITHUB_WORKSPACE/CSXCAD
            mkdir build && cd build
            cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt
            make -j$NCPUS && make install

            echo "Build and install CSXCAD Python module with --no-build-isolation..."
            cd $GITHUB_WORKSPACE/CSXCAD/python
            export CSXCAD_INSTALL_PATH=$HOME/opt/
            pip install . --user --break-system-packages --no-build-isolation --verbose

            echo "Build and install openEMS..."
            cd $GITHUB_WORKSPACE/openEMS
            mkdir build && cd build
            cmake ../ -DCMAKE_INSTALL_PREFIX=$HOME/opt -DFPARSER_ROOT_DIR=$HOME/opt
            make -j$NCPUS && make install

            echo "addpath('~/opt/share/openEMS/matlab')" >> ~/.octaverc
            echo "addpath('~/opt/share/CSXCAD/matlab')" >> ~/.octaverc

            echo "Build and install openEMS Python module with --no-build-isolation..."
            cd $GITHUB_WORKSPACE/openEMS/python
            export CSXCAD_INSTALL_PATH=$HOME/opt/
            export OPENEMS_INSTALL_PATH=$HOME/opt/
            pip install . --user --break-system-packages --no-build-isolation --verbose

            echo "Smoketest Octave execution..."
            cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/octave/
            octave MSL_NotchFilter.m

            echo "Smoketest Python execution..."
            cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/python
            python3 -c "import CSXCAD; print(CSXCAD.__version__)"
            python3 -c "import openEMS; print(openEMS.__version__)"
            python3 MSL_NotchFilter.py

            echo "Run Python unit tests..."
            python3 -m unittest discover -s $GITHUB_WORKSPACE/openEMS/python/Tests -p "test_*.py" -v

            echo "Create Python venv and install dependencies..."
            # remove Python dependencies to see if venv really works
            pip uninstall -y CSXCAD openEMS cython --break-system-packages
            sudo pkg remove -y ${PYVER}-pip \
                               ${PYVER}-setuptools ${PYVER}-wheel ${PYVER}-setuptools-scm \
                               ${PYVER}-numpy ${PYVER}-h5py ${PYVER}-matplotlib
            python3 -m venv ~/venv
            . ~/venv/bin/activate
            pip install --upgrade pip

            echo "Build and install CSXCAD Python module in venv..."
            cd $GITHUB_WORKSPACE/CSXCAD/python
            export CSXCAD_INSTALL_PATH="$HOME/opt"
            pip install . --verbose

            echo "Build and install openEMS Python module in venv..."
            cd $GITHUB_WORKSPACE/openEMS/python

            # \sa the GNU/Linux job, same reason
            export CSXCAD_PYSRC_PATH=$GITHUB_WORKSPACE/CSXCAD/python/

            export CSXCAD_INSTALL_PATH="$HOME/opt"
            export OPENEMS_INSTALL_PATH="$HOME/opt"
            pip install . --verbose

            echo "Smoketest Python execution in venv..."
            cd $GITHUB_WORKSPACE/openEMS/.github/smoketests/python
            python3 -c "import CSXCAD; print(CSXCAD.__version__)"
            python3 -c "import openEMS; print(openEMS.__version__)"
            python3 MSL_NotchFilter.py

            echo "Run Python unit tests in venv..."
            python3 -m unittest discover -s $GITHUB_WORKSPACE/openEMS/python/Tests -p "test_*.py" -v

  Windows:
    runs-on: ${{ matrix.toolchain.runner || 'windows-latest' }}
    needs: Dependencies

    strategy:
      # Use "false" means a single failed build won't terminate other combinations
      # in the matrix. This wastes CPU time, but is an important debugging tool to
      # prevent a single broken platform from stopping the whole matrix.
      fail-fast: false

      matrix:
        toolchain:
          # name: toonchain name (only a name for humans to read).
          # CC, CXX: C/C++ compiler, environment variables
          - name: "MSVC"
            CC: "cl"
            CXX: "cl"

          - name: "clang-cl"
            CC: "clang-cl"
            CXX: "clang-cl"

          # gpu: "rocm": also build the AMD GPU plugin, with ROCm from AMD's
          # Python wheels, and check it on a runner without a GPU.
          # runner: the HIP math headers of ROCm's clang 23 collide with the
          # STL of MSVC 14.51 (isgreater & co.), so stay on VS 2022 for now
          - name: "clang + ROCm"
            CC: "cl"
            CXX: "cl"
            gpu: "rocm"
            runner: "windows-2022"

          # gpu: "cuda+rocm": both GPU plugins, as the Windows package builds
          # them: openEMS and the NVIDIA plugin (nvcc of the CUDA toolkit, the
          # HIP headers for NVIDIA) with MSVC, then the AMD plugin alone with
          # ROCm's clang in a second build that shares the build id.
          # runner: CUDA 12.9 knows MSVC up to VS 2022
          - name: "MSVC + CUDA + ROCm"
            CC: "cl"
            CXX: "cl"
            gpu: "cuda+rocm"
            runner: "windows-2022"

    env:
      CC: "${{ matrix.toolchain.CC }}"
      CXX: "${{ matrix.toolchain.CXX }}"
      CFLAGS: "/D_WIN32_WINNT=0x0601"
      CXXFLAGS: "/D_WIN32_WINNT=0x0601"

      VCPKG_CACHE_PATH: "${{ github.workspace }}/vcpkg-cache/"
      VCPKG_BINARY_CACHE_PATH: "${{ github.workspace }}/vcpkg-cache/binary"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache/binary,readwrite"
      VCPKG_ASSET_CACHE_PATH: "${{ github.workspace }}/vcpkg-cache/asset"
      X_VCPKG_ASSET_SOURCES: "x-azurl,file://${{ github.workspace }}/vcpkg-cache/asset,readwrite"

    name: "Windows (${{ matrix.toolchain.name }}, ${{ matrix.toolchain.runner || 'latest' }})"

    steps:
      - name: Locate Visual Studio installation
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "Visual Studio with VC tools not found via vswhere" }
          echo "VS_ROOT_DIR=$vsPath" >> $env:GITHUB_ENV

      - name: Show checkout sources
        run: |
          echo "$env:FPARSER_CHECKOUT_TITLE"
          echo "$env:CSXCAD_CHECKOUT_TITLE"
        env:
          # convert template variables to shell variables to avoid arbitrary code injection
          FPARSER_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
          CSXCAD_CHECKOUT_TITLE: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}

      # When checking out repos, I recommend running actions/checkout
      # as soon as possible before anything else, and in the reverse
      # order, from the project repo to its dependencies. This reduces
      # race conditions due to force pushes (they are harmless but
      # annoying).
      - name: Checkout openEMS.git
        uses: actions/checkout@v4
        with:
          path: openEMS
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.csxcad_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.csxcad_repo }}"
          ref: "${{ needs.Dependencies.outputs.csxcad_branch }}"
          path: CSXCAD
          # checkout must be deep, not shallow.
          # We need tags for "git describe", otherwise build fails.
          fetch-depth: 0

      - name: ${{ needs.Dependencies.outputs.fparser_checkout_title }}
        uses: actions/checkout@v4
        with:
          repository: "${{ needs.Dependencies.outputs.fparser_repo }}"
          ref: "${{ needs.Dependencies.outputs.fparser_branch }}"
          path: fparser

      # It doesn't really work, because MSVC itself doesn't support long path.
      # But for future-proofing (it does work for clang).
      - name: Enable long paths
        run: |
          New-ItemProperty -Path "HKLM:/SYSTEM/CurrentControlSet/Control/FileSystem" `
                           -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Create vcpkg cache directories
        run: |
          mkdir -p "$env:VCPKG_CACHE_PATH"
          mkdir -p "$env:VCPKG_BINARY_CACHE_PATH"
          mkdir -p "$env:VCPKG_ASSET_CACHE_PATH"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_CACHE_PATH }}
          # almost always nonexistent
          key: "Windows - ${{ matrix.toolchain.name }}${{ matrix.toolchain.runner }} - ${{ github.sha }}"
          # use GitHub's fallback feature to pick the latest cache with this prefix
          restore-keys: |
            Windows - ${{ matrix.toolchain.name }}${{ matrix.toolchain.runner }}

      - name: Build and install fparser
        run: |
          & "$env:VS_ROOT_DIR/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64

          cd "$env:GITHUB_WORKSPACE/fparser"
          mkdir build && cd build
          cmake ../ -GNinja -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DCMAKE_INSTALL_PREFIX="$HOME/opt"

          cmake --build ./ --parallel
          cmake --install ./ --parallel 8

      - name: Build and install CSXCAD
        run: |
          & "$env:VS_ROOT_DIR/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64

          cd "$env:GITHUB_WORKSPACE/CSXCAD"
          mkdir build && cd build
          cmake ../ -GNinja `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DCMAKE_INSTALL_PREFIX="$HOME/opt" `
                    -DFPARSER_ROOT_DIR="$HOME/opt" `
                    -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
                    -DVCPKG_HOST_TRIPLET="x64-windows-release" `
                    -DVCPKG_TARGET_TRIPLET="x64-windows-release"

          cmake --build ./ --parallel
          cmake --install ./ --parallel 8

      - name: Install ROCm (AMD's Python wheels)
        if: contains(matrix.toolchain.gpu, 'rocm')
        run: |
          python -m venv C:\rocm
          C:\rocm\Scripts\pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[devel]==10.0.0"
          C:\rocm\Scripts\rocm-sdk init
          if ($LASTEXITCODE -ne 0) { throw "rocm-sdk init failed" }
          $root = (C:\rocm\Scripts\rocm-sdk path --root).Trim()
          Write-Host "ROCm: $root"
          echo "HIP_PATH=$root" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$root\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV

      - name: Install CUDA and the HIP headers for NVIDIA
        if: contains(matrix.toolchain.gpu, 'cuda')
        run: |
          # the compiler and the runtime only, no driver; the HIP headers for
          # NVIDIA include cuda_profiler_api.h
          $installer = "$env:RUNNER_TEMP\cuda.exe"
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/12.9.1/network_installers/cuda_12.9.1_windows_network.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "-s", "nvcc_12.9", "cudart_12.9", "cuda_profiler_api_12.9" -Wait
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          & "$cuda\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc not installed" }
          echo "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          echo "CUDACXX=$cuda\bin\nvcc.exe" >> $env:GITHUB_ENV

          # the HIP headers of one ROCm release from AMD's apt repository, as on
          # Linux; the headers are the same for Windows, and tar unpacks a .deb
          $repo = "https://repo.radeon.com/rocm/apt/7.2.4"
          Invoke-WebRequest -Uri "$repo/dists/noble/main/binary-amd64/Packages" -OutFile "$env:RUNNER_TEMP\Packages"
          $index = Get-Content -Raw "$env:RUNNER_TEMP\Packages"
          $hip = "C:\hip"
          New-Item -ItemType Directory -Force -Path $hip, "$env:RUNNER_TEMP\hipdeb" | Out-Null
          foreach ($pkg in @("hip-dev", "hip-runtime-nvidia")) {
            $file = [regex]::Match($index, "(?m)^Package: $pkg\r?\n(?:[^\n]+\n)*?Filename: (\S+)").Groups[1].Value
            if (-not $file) { throw "$pkg not in the repository" }
            $deb = "$env:RUNNER_TEMP\hipdeb\$pkg.deb"
            Invoke-WebRequest -Uri "$repo/$file" -OutFile $deb
            cd "$env:RUNNER_TEMP\hipdeb"
            tar -xf $deb
            $data = Get-ChildItem -Filter "data.tar*" | Select-Object -First 1
            tar -xf $data.FullName -C $hip
            Remove-Item data.tar*, control.tar*, debian-binary
          }
          $root = (Get-ChildItem "$hip\opt" -Directory -Filter "rocm-*" | Select-Object -First 1).FullName
          foreach ($h in @("hip_runtime.h", "hip_version.h", "nvidia_detail\nvidia_hip_runtime.h")) {
            if (-not (Test-Path "$root\include\hip\$h")) { throw "$h missing" }
          }
          Write-Host "HIP headers: $root"
          echo "HIP_NVIDIA_ROOT=$root" >> $env:GITHUB_ENV

      - name: Build and install openEMS
        run: |
          & "$env:VS_ROOT_DIR/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64

          $hip_opts = @()
          if ("${{ matrix.toolchain.gpu }}" -eq "rocm") {
            # CMake does not mix MSVC with the GNU-like clang for HIP: ROCm's
            # clang builds all of openEMS (for the MSVC ABI), fparser and
            # CSXCAD stay with MSVC
            $rocm = $env:HIP_PATH -replace '\\', '/'
            $env:CFLAGS = "-D_WIN32_WINNT=0x0601"
            $env:CXXFLAGS = "-D_WIN32_WINNT=0x0601"
            $hip_opts = @("-DENABLE_HIP=ON", "-DOPENEMS_HIP_AS_CUDA=OFF", "-DROCM_PATH=$rocm",
                          "-DCMAKE_C_COMPILER=$rocm/lib/llvm/bin/clang.exe",
                          "-DCMAKE_CXX_COMPILER=$rocm/lib/llvm/bin/clang++.exe",
                          "-DCMAKE_HIP_COMPILER=$rocm/lib/llvm/bin/clang++.exe",
                          "-DCMAKE_HIP_COMPILER_ROCM_ROOT=$rocm")
          }
          if ("${{ matrix.toolchain.gpu }}" -match "cuda") {
            $hip_opts = @("-DENABLE_HIP=ON", "-DOPENEMS_HIP_AS_CUDA=ON",
                          "-DROCM_PATH=$($env:HIP_NVIDIA_ROOT -replace '\\', '/')")
          }
          cd "$env:GITHUB_WORKSPACE/openEMS"
          mkdir build && cd build
          cmake ../ -GNinja `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DCMAKE_INSTALL_PREFIX="$HOME/opt" `
                    -DFPARSER_ROOT_DIR="$HOME/opt" `
                    -DCSXCAD_ROOT_DIR="$HOME/opt" `
                    -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
                    -DVCPKG_HOST_TRIPLET="x64-windows-release" `
                    -DVCPKG_TARGET_TRIPLET="x64-windows-release" `
                    @hip_opts
          if ($LASTEXITCODE -ne 0) { throw "cmake failed" }

          cmake --build ./ --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          cmake --install ./ --parallel 8

          if ("${{ matrix.toolchain.gpu }}" -eq "cuda+rocm") {
            # the AMD plugin from a second build with ROCm's clang (CMake does not
            # mix it with MSVC), against the openEMS.dll of the build above: the
            # same sources, exports and build id
            $id = (Select-String -Path CMakeCache.txt -Pattern "^OPENEMS_GPU_BUILD_ID:INTERNAL=(.+)$").Matches[0].Groups[1].Value
            Write-Host "build id: $id"
            $rocm = $env:HIP_PATH -replace '\\', '/'
            $env:ROCM_PATH = $env:HIP_PATH
            $env:CFLAGS = "-D_WIN32_WINNT=0x0601"
            $env:CXXFLAGS = "-D_WIN32_WINNT=0x0601"
            cd "$env:GITHUB_WORKSPACE/openEMS"
            mkdir build-amd && cd build-amd
            cmake ../ -GNinja `
                      -DCMAKE_BUILD_TYPE=Release `
                      -DFPARSER_ROOT_DIR="$HOME/opt" `
                      -DCSXCAD_ROOT_DIR="$HOME/opt" `
                      -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
                      -DVCPKG_HOST_TRIPLET="x64-windows-release" `
                      -DVCPKG_TARGET_TRIPLET="x64-windows-release" `
                      -DOPENEMS_GPU_BUILD_ID="$id" `
                      -DENABLE_HIP=ON -DOPENEMS_HIP_AS_CUDA=OFF -DROCM_PATH="$rocm" `
                      -DCMAKE_C_COMPILER="$rocm/lib/llvm/bin/clang.exe" `
                      -DCMAKE_CXX_COMPILER="$rocm/lib/llvm/bin/clang++.exe" `
                      -DCMAKE_HIP_COMPILER="$rocm/lib/llvm/bin/clang++.exe" `
                      -DCMAKE_HIP_COMPILER_ROCM_ROOT="$rocm"
            if ($LASTEXITCODE -ne 0) { throw "cmake (AMD plugin) failed" }
            cmake --build ./ --parallel --target openEMS_gpu_hip_amd
            if ($LASTEXITCODE -ne 0) { throw "build (AMD plugin) failed" }
            Copy-Item plugins/openEMS_gpu_hip_amd.dll "$HOME/opt/bin/openEMS/plugins/"
          }

      - name: GPU plugin on a machine without a GPU
        if: matrix.toolchain.gpu
        run: |
          & "$env:VS_ROOT_DIR/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          $amd = "${{ matrix.toolchain.gpu }}" -match "rocm"
          $nvidia = "${{ matrix.toolchain.gpu }}" -match "cuda"
          $plugins = "$HOME/opt/bin/openEMS/plugins"
          Get-ChildItem $plugins | Format-Table Name, Length
          Get-ChildItem $plugins -Filter "openEMS_gpu_*.dll" | ForEach-Object { dumpbin /nologo /dependents $_.FullName }
          # openEMS.dll itself needs no GPU runtime
          if (dumpbin /nologo /dependents "$HOME/opt/bin/openEMS.dll" | Select-String "amdhip64|cudart|nvcuda") {
            throw "openEMS.dll links a GPU runtime"
          }
          $env:PATH = "$HOME/opt/bin;$env:GITHUB_WORKSPACE/openEMS/build/vcpkg_installed/x64-windows-release/bin;$env:PATH"
          $xml = "$env:GITHUB_WORKSPACE/openEMS/.github/smoketests/gpu/gpu_engine.xml"
          cd $env:RUNNER_TEMP

          # without a driver: the NVIDIA plugin (CUDA runtime linked in statically,
          # it looks for the driver when asked for devices) loads and finds no
          # device, the AMD plugin cannot load without the HIP runtime and says why
          $out = & "$HOME/opt/bin/openEMS.exe" $xml --engine=gpu -v 2>&1 | Out-String
          Write-Host $out
          if ($nvidia -and $out -notmatch "no hip-nvidia device") { throw "the NVIDIA plugin did not load" }
          if ($amd -and $out -notmatch "openEMS_gpu_hip_amd.dll: .*library the plugin needs is missing") { throw "no load error for the AMD plugin" }
          if ($out -notmatch "no GPU backend with a usable device") { throw "the GPU engine did not fail" }
          if (-not $amd) { exit 0 }

          # with the runtime of the build next to the plugin: it loads and finds no device
          foreach ($p in @("amdhip64_7.dll", "rocm_kpack.dll", "amd_comgr*.dll")) {
            Get-ChildItem "$env:HIP_PATH/bin" -Filter $p | Copy-Item -Destination $plugins
          }
          $out = & "$HOME/opt/bin/openEMS.exe" $xml --engine=gpu -v 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "no hip-amd device") { throw "the AMD plugin did not load" }
          exit 0

      - name: Save vcpkg cache
        if: always()  # save even after a build failure.
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_CACHE_PATH }}
          # GitHub cache is immutable and can't be overwritten
          # save a new cache key every time
          key: Windows - ${{ matrix.toolchain.name }}${{ matrix.toolchain.runner }} - ${{ github.sha }}
