<text x="116" y="274"><tspan font-weight="bold">Mountains</tspan> shrink by one cell per half-step: they need nothing from outside, so all run first.</text>
<rect x="96" y="283" width="14" height="12" fill="#fde7c8" stroke="#b5701f"/>
<text x="116" y="294"><tspan font-weight="bold">Valleys</tspan> widen into the cells the mountains left behind, reading their finished edges.</text>
<text x="96" y="316">Each labelled tile is one threadgroup; it walks its rows top to bottom with a barrier between rows.</text>
<text x="96" y="346" font-size="14" font-weight="bold">Two axes: four phases, one dispatch each, run in order 1 → 4</text>
